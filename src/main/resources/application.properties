spring.application.name=tcc-api
spring.profiles.default=https

# Conexao com o PostgreSQL (sobe via docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/tccdb_entrega3
spring.datasource.username=tccuser
spring.datasource.password=tccpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cria/atualiza as tabelas automaticamente a partir das entidades
# (facilita o baseline; pode trocar por Flyway/Liquibase depois se quiser)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Chave aleatoria Base64, definida externamente. Nenhum segredo padrao.
app.jwt.secret=${JWT_SECRET}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never

server.forward-headers-strategy=none
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
app.limits.api=${RATE_API:120}
app.limits.auth=${RATE_AUTH:10}
app.limits.window-seconds=${RATE_WINDOW_SECONDS:60}
app.limits.max-clients=10000
app.limits.max-body-bytes=16384
